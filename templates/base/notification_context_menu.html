<div class="context-menu-container">
    <div class="context-menu-btn btn-select-message">
        <svg class="mdi mdi-24px mdi-svg-template fill-color-grey-500" data-svgname="check"></svg>
        <div class="context-menu-btn-text">{[print(xabber.getString("select"))]}</div>
    </div>
    <div class="context-menu-btn btn-copy-message">
        <svg class="mdi mdi-24px mdi-svg-template fill-color-grey-500" data-svgname="copy"></svg>
        <div class="context-menu-btn-text"></div>
    </div>
    <div class="context-menu-btn btn-delete-message">
        <svg class="mdi mdi-24px mdi-svg-template fill-color-red-700" data-svgname="trash"></svg>
        <div class="context-menu-btn-text text-color-red-700">{[print(xabber.getString("delete"))]}</div>
    </div>
</div>
