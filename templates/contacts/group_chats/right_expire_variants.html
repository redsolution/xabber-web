<div class="select-timer">
    <div class="dropdown-button" data-activates="select-timer-{{right_name}}">
        <div class="timer-item-wrap"><div data-value="0" class="property-value">{[print(xabber.getString("forever"))]}</div></div>
    </div>
    <div id="select-timer-{{right_name}}" class="dropdown-content unified-dropdown-style noselect">
        <div data-value="0" class="property-variant">Forever</div>
        <div data-value="3600" class="property-variant">1 hour</div>
        <div data-value="14400" class="property-variant">4 hours</div>
        <div data-value="86400" class="property-variant">1 day</div>
        <div data-value="604800" class="property-variant">1 week</div>
    </div>
</div>
