<div class="notification-subscription-item {[if (group_chat) {]}invitation-notifications-item{[} else {]}incoming-subscription-notifications-item{[}]}" data-account-jid="{{account}}" data-jid="{{jid}}">
    <div class="avatar-wrap">
        <div class="account-indicator-background-exclude">
            <div class="account-indicator ground-color-700"></div>
            <div class="circle-avatar subscribe-avatar"></div>
        </div>
        <div class="circle-avatar subscribe-avatar"></div>
        <div class="notification-icon subscribe-icon ground-color-500"></div>
    </div>
    <div class="subcription-main-wrap">
        <div class="subscription-item-name">{{name}}</div>
        <div class="subscription-item-jid">{{jid}}</div>
        {[if (text) {]}
        <div class="subscription-item-text border-color-500">{{text}}</div>
        {[}]}
    </div>
    <div class="subscription-button btn-add ground-color-500">{[print(xabber.getString("contact_add"))]}</div>
    <i class="btn-decline-options mdi mdi-24px mdi-close dropdown-button" data-activates="{{dropdown_id}}-decline-options"></i>
    <ul id="{{dropdown_id}}-decline-options" class="dropdown-content bootstrap-dropdown noselect">
        <div class="property-variant btn-decline">
            <span class="one-line">{[print(xabber.getString("decline"))]}</span>
        </div>
        <div class="property-variant btn-block">
            <span class="one-line">{[print(xabber.getString("contact_bar_block"))]}</span>
        </div>
    </ul>
        <!--<div class="subscription-button btn-decline">{[print(xabber.getString("decline"))]}</div>-->
        <!--<div class="subscription-button btn-block">{[print(xabber.getString("block"))]}</div>-->
</div>
