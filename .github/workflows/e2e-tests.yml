name: E2E Tests

# SECURITY: Only triggers on push (direct commits / merged PRs).
# Never triggers on pull_request — prevents forks from running code on the runner.
on:
  push:
    branches:
      - vue3-migration-v2
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  e2e-tests:
    if: github.repository == 'redsolution/xabber-web'
    runs-on: [self-hosted, macos, xabber-tests]
    timeout-minutes: 60
    env:
      PATH: /Users/admin/node/bin:/usr/local/bin:/Applications/Docker.app/Contents/Resources/bin:/usr/bin:/bin:/usr/sbin:/sbin
      HOME: /Users/admin

    steps:
      - name: Pull latest xabber-web
        run: |
          cd ~/xabber-web
          git fetch origin
          git checkout vue3-migration-v2
          git reset --hard origin/vue3-migration-v2
          npm install

      - name: Pull latest xabber-tests
        run: |
          cd ~/xabber-tests
          git pull

      - name: Reset seed container
        shell: bash --noprofile --norc {0}
        run: |
          set -x
          docker rm -f testing-xabberserver-seed 2>/dev/null || true
          for i in $(seq 1 30); do
            docker inspect testing-xabberserver-seed >/dev/null 2>&1 || break
            sleep 1
          done
          sleep 2
          docker run -d --name testing-xabberserver-seed \
            -p 443:443 -p 5222:5222 -p 5223:5223 -p 5269:5269 \
            -p 5280:5280 -p 5443:5443 -p 80:80 \
            redsolution/testing-xabberserver:seed
          if [ $? -ne 0 ]; then echo "docker run failed"; exit 1; fi
          echo "Waiting for XMPP port..."
          for i in $(seq 1 90); do
            nc -z -G 2 localhost 5222 2>/dev/null && echo "XMPP port open" && break
            sleep 1
          done
          echo "Waiting for WebSocket port..."
          WS_READY=false
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:5280/ws 2>/dev/null || true)
            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then
              echo "WS port ready (HTTP $CODE)"
              WS_READY=true
              break
            fi
            sleep 1
          done
          echo "Waiting for ejabberd module init..."
          sleep 15
          echo "Server ready."

      - name: Start Vite dev server
        shell: bash --noprofile --norc {0}
        run: |
          pkill -f "vite --host" 2>/dev/null || true
          sleep 1
          cd ~/xabber-web
          nohup npx vite --host > ~/vite-ci.log 2>&1 &
          echo "Waiting for Vite..."
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 2>/dev/null && echo "Vite ready" && break
            sleep 1
          done

      - name: Run seeded tests
        id: seeded
        shell: bash --noprofile --norc {0}
        run: |
          cd ~/xabber-tests/xabber-web
          npx playwright test --config=playwright.seeded.config.ts
          echo "SEEDED_EXIT=$?" >> "$GITHUB_OUTPUT"

      - name: Save seeded report
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          cd ~/xabber-tests/xabber-web
          rm -rf seeded-report seeded-test-results
          mv playwright-report seeded-report 2>/dev/null || true
          mv test-results seeded-test-results 2>/dev/null || true

      - name: Run trust tests
        id: trust
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          cd ~/xabber-tests/xabber-web
          npx playwright test --config=playwright.trust.config.ts
          echo "TRUST_EXIT=$?" >> "$GITHUB_OUTPUT"

      - name: Save reports with traces and videos
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          COMMIT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          REPORT_DIR=~/test-reports/${TIMESTAMP}_${COMMIT_SHA}
          mkdir -p "$REPORT_DIR/seeded" "$REPORT_DIR/trust"
          # Seeded report
          cp -R ~/xabber-tests/xabber-web/seeded-report/* "$REPORT_DIR/seeded/" 2>/dev/null || true
          cp -R ~/xabber-tests/xabber-web/seeded-test-results "$REPORT_DIR/seeded/test-results" 2>/dev/null || true
          # Trust report
          cp -R ~/xabber-tests/xabber-web/playwright-report/* "$REPORT_DIR/trust/" 2>/dev/null || true
          cp -R ~/xabber-tests/xabber-web/test-results "$REPORT_DIR/trust/test-results" 2>/dev/null || true
          rm -f ~/test-reports/latest
          ln -s "$REPORT_DIR" ~/test-reports/latest
          echo "Report saved to $REPORT_DIR"

      - name: Host reports
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          pkill -f "playwright show-report" 2>/dev/null || true
          sleep 1
          # Host seeded report on port 9324
          cd ~/test-reports/latest/seeded 2>/dev/null && \
            nohup npx --prefix ~/xabber-tests/xabber-web \
              playwright show-report . --host 0.0.0.0 --port 9324 \
              > ~/seeded-report-server.log 2>&1 &
          # Host trust report on port 9323
          cd ~/test-reports/latest/trust 2>/dev/null && \
            nohup npx --prefix ~/xabber-tests/xabber-web \
              playwright show-report . --host 0.0.0.0 --port 9323 \
              > ~/report-server.log 2>&1 &
          echo "Seeded report: http://192.168.11.56:9324"
          echo "Trust report:  http://192.168.11.56:9323"

      - name: Stop Vite dev server
        if: always()
        shell: bash --noprofile --norc {0}
        run: pkill -f "vite --host" 2>/dev/null || true

      - name: Cleanup old reports (keep last 10)
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          cd ~/test-reports 2>/dev/null || exit 0
          ls -dt */ 2>/dev/null | grep -v latest | tail -n +11 | xargs rm -rf 2>/dev/null || true

      - name: Check results
        if: always()
        run: |
          SEEDED=${{ steps.seeded.outputs.SEEDED_EXIT || '1' }}
          TRUST=${{ steps.trust.outputs.TRUST_EXIT || '1' }}
          echo "Seeded tests exit code: $SEEDED"
          echo "Trust tests exit code: $TRUST"
          if [ "$SEEDED" != "0" ] || [ "$TRUST" != "0" ]; then
            echo "One or more test suites failed"
            exit 1
          fi
