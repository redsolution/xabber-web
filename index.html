<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xabber Web</title>
    <link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png"/>
</head>
<body style="height: 100%; width: 100%;">
    <div id="xabber-container" style="height: 100%; width: 100%;">
        <div class="login-container"></div>
    </div>
    <script>
        // Suppress Vue DEV-mode "nextSibling" errors caused by Backbone/Vue DOM conflicts
        window.addEventListener('error', function(e) {
            if (e.message && e.message.indexOf('nextSibling') !== -1) {
                e.preventDefault();
                e.stopImmediatePropagation();
                return false;
            }
        }, true);
    </script>
    <script type="module">
        import '/src/xabber.js';
        xabber.configure({
            CONNECTION_URL: '%VITE_CONNECTION_URL%',
            LOG_LEVEL: 'INFO',
            DEBUG: true,
            STORAGE_NAME_ENDING: 'dev'
        });
        xabber.start();
    </script>
</body>
</html>
